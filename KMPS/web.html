<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman Web</title>
<style>
  :root {
    --bg: #ffffff;        /* latar halaman (tema terang) */
    --fg: #1a1a1a;        /* warna teks */
    --line: #d4d4d8;      /* garis pil */
    --link-bg: #3a3a3c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111111;
      --fg: #e6e6e6;
      --line: #3a3a3a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .sources {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 14px 30px 14px 38px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    background: transparent;
  }
  .icons { display: flex; align-items: center; }
  .icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    margin-left: -6px;
    display: grid;
    place-items: center;
    overflow: hidden;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    border: 2px solid var(--bg); /* "potongan" tipis antar ikon, mengikuti latar tema */
  }
  .icon:first-child { margin-left: 0; }
  .icon img { width: 100%; height: 100%; object-fit: cover; }
  .icon svg { width: 18px; height: 18px; }
  .label { font-size: 28px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap; }
  @media (max-width: 420px) {
    .sources { padding: 10px 20px 10px 24px; gap: 10px; }
    .icon { width: 30px; height: 30px; }
    .label { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="sources" id="sources" role="status"></div>

<script>
  // ====== UBAH DI SINI ======
  const total = 33;

  // Tiap ikon: pakai "img" (URL favicon) ATAU "text" + "bg" (warna latar).
  // Ikon pertama = ikon link abu-abu (default).
  const icons = [
    { type: "link", bg: "var(--link-bg)" },
    { text: "P", bg: "#ffffff", color: "#111" },
    { text: "7", bg: "#1565c0" },
    { text: "o", bg: "#f28c28" }
    // contoh favicon: { img: "https://www.google.com/s2/favicons?domain=playstation.com&sz=64" }
  ];
  // ==========================

  const linkSvg = `
    <svg viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/>
      <path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>
    </svg>`;

  const iconsHtml = icons.map(i => {
    const style = `background:${i.bg || "#333"};${i.color ? `color:${i.color};` : ""}`;
    let inner = "";
    if (i.type === "link") inner = linkSvg;
    else if (i.img) inner = `<img src="${i.img}" alt="">`;
    else inner = i.text || "";
    return `<span class="icon" style="${style}">${inner}</span>`;
  }).join("");

  document.getElementById("sources").innerHTML =
    `<div class="icons">${iconsHtml}</div><span class="label">${total} halaman web</span>`;
</script>

</body>
</html>
