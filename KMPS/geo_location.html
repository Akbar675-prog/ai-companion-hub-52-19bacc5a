<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map</title><style>body{margin:0;padding:16px;background:#fff}.map{max-width:720px;margin:0 auto;background:#4aa8ff;border:3px solid #3f95e6;line-height:0}.map svg{width:100%;height:auto;display:block}.land{stroke:rgba(255,255,255,.35);stroke-width:.6;vector-effect:non-scaling-stroke}</style></head><body><div class="map" id="map"><svg id="svg"></svg></div><script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script><script>const COUNTRY="Indonesia",COLORS={ocean:"#4aa8ff",land:"#a8dc9f",highlight:"#fb8b55"},ZOOM={max:6,padding:1.4,minScale:1.5},W=960,NS="http://www.w3.org/2000/svg",svg=document.getElementById("svg");let path,fullH;fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json").then(r=>r.json()).then(world=>{const features=topojson.feature(world,world.objects.countries).features.filter(f=>f.properties.name!=="Antarctica"),fc={type:"FeatureCollection",features},proj=d3.geoMercator().fitWidth(W,fc).clipExtent([[0,0],[W,W*2]]);path=d3.geoPath(proj);fullH=Math.ceil(path.bounds(fc)[1][1]);document.getElementById("map").style.background=COLORS.ocean;const add=(tag,attrs)=>{const el=document.createElementNS(NS,tag);for(const k in attrs)el.setAttribute(k,attrs[k]);svg.appendChild(el);return el};const active=new Set([].concat(COUNTRY));features.forEach(f=>{const d=path(f);if(!d)return;add("path",{d,fill:active.has(f.properties.name)?COLORS.highlight:COLORS.land,class:"land"})});svg.setAttribute("viewBox",computeViewBox(features,active))});function computeViewBox(features,active){const sel=features.filter(f=>active.has(f.properties.name));if(!sel.length)return`0 0 ${W} ${fullH}`;const[[x0,y0],[x1,y1]]=path.bounds({type:"FeatureCollection",features:sel}),w=Math.max(x1-x0,1),h=Math.max(y1-y0,1),cx=(x0+x1)/2,cy=(y0+y1)/2,scale=Math.min(W/(w*ZOOM.padding),fullH/(h*ZOOM.padding));if(scale<ZOOM.minScale)return`0 0 ${W} ${fullH}`;const k=Math.min(scale,ZOOM.max),vw=W/k,vh=fullH/k;return`${cx-vw/2} ${cy-vh/2} ${vw} ${vh}`}// Indonesia, Malaysia, Singapore, Brunei, Thailand, Vietnam, Laos, Cambodia, Myanmar, Philippines, Timor-Leste, Papua New Guinea, Japan, South Korea, North Korea, China, Taiwan, Mongolia, India, Pakistan, Bangladesh, Sri Lanka, Nepal, Bhutan, Afghanistan, Iran, Iraq, Syria, Lebanon, Israel, Jordan, Saudi Arabia, United Arab Emirates, Qatar, Kuwait, Oman, Yemen, Turkey, Kazakhstan, Uzbekistan, Turkmenistan, Kyrgyzstan, Tajikistan, Australia, New Zealand, Fiji, Solomon Is., Vanuatu, New Caledonia, United States of America, Canada, Mexico, Guatemala, Belize, Honduras, El Salvador, Nicaragua, Costa Rica, Panama, Cuba, Haiti, Dominican Rep., Jamaica, Bahamas, Trinidad and Tobago, Puerto Rico, Colombia, Venezuela, Ecuador, Peru, Bolivia, Brazil, Paraguay, Uruguay, Argentina, Chile, Guyana, Suriname, United Kingdom, Ireland, France, Germany, Italy, Spain, Portugal, Netherlands, Belgium, Luxembourg, Switzerland, Austria, Poland, Czechia, Slovakia, Hungary, Romania, Bulgaria, Greece, Croatia, Slovenia, Serbia, Bosnia and Herz., Montenegro, North Macedonia, Albania, Kosovo, Sweden, Norway, Finland, Denmark, Iceland, Estonia, Latvia, Lithuania, Belarus, Ukraine, Moldova, Russia, Georgia, Armenia, Azerbaijan, Cyprus, N. Cyprus, Malta, Egypt, Libya, Tunisia, Algeria, Morocco, W. Sahara, Mauritania, Mali, Niger, Chad, Sudan, S. Sudan, Ethiopia, Eritrea, Djibouti, Somalia, Somaliland, Kenya, Uganda, Rwanda, Burundi, Tanzania, Dem. Rep. Congo, Congo, Gabon, Eq. Guinea, Cameroon, Central African Rep., Nigeria, Benin, Togo, Ghana, Côte d'Ivoire, Liberia, Sierra Leone, Guinea, Guinea-Bissau, Senegal, Gambia, Burkina Faso, Angola, Zambia, Malawi, Mozambique, Zimbabwe, Botswana, Namibia, South Africa, Lesotho, eSwatini, Madagascar, Mauritius, Seychelles, Comoros, Cape Verde</script></body></html>
