<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skeleton Bulat</title>
<style>
  :root{--sk-base:#e3e3e3;--sk-shine:#f2f2f2}
  html,body{margin:0;height:100%;background:#fff}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}

  .sk-circle{
    display:block;
    width:min(100vw,100vh);
    height:min(100vw,100vh);
    border-radius:50%;
    background:linear-gradient(90deg,var(--sk-base) 25%,var(--sk-shine) 50%,var(--sk-base) 75%);
    background-size:200% 100%;
    animation:sk-shimmer 1.4s ease-in-out infinite;
  }
  @keyframes sk-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.sk-circle{animation:none}}
</style>
</head>
<body>
  <span class="sk-circle"></span>
</body>
</html>
