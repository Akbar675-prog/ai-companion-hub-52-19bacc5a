<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account creation location map</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; }
      body { padding: 8px; background: transparent; font-family: system-ui, sans-serif; }
      .map { width: 100%; height: 100%; overflow: hidden; border: 1px solid #3f95e6; border-radius: 14px; background: #4aa8ff; line-height: 0; }
      .map svg { display: block; width: 100%; height: 100%; }
      .land { stroke: rgba(255,255,255,.45); stroke-width: .7; vector-effect: non-scaling-stroke; }
      @media (prefers-color-scheme: dark) {
        body { background: transparent; }
        .map { border-color: #326eac; }
      }
    </style>
  </head>
  <body>
    <div class="map"><svg id="map" role="img" aria-label="Map showing the account creation country"></svg></div>
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
    <script>
      const COUNTRY = new URLSearchParams(location.search).get("country") || "";
      const WIDTH = 960;
      const HEIGHT = 480;
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("map");

      fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json")
        .then((response) => response.json())
        .then((world) => {
          const features = topojson.feature(world, world.objects.countries).features
            .filter((feature) => feature.properties.name !== "Antarctica");
          const collection = { type: "FeatureCollection", features };
          const projection = d3.geoMercator().fitSize([WIDTH, HEIGHT], collection);
          const path = d3.geoPath(projection);
          const countryAliases = { "United States": "united states of america" };
          const selectedName = (countryAliases[COUNTRY] || COUNTRY).toLowerCase().replace(/[’‘]/g, "'");
          const selected = features.filter((feature) =>
            feature.properties.name.toLowerCase().replace(/[’‘]/g, "'") === selectedName,
          );

          for (const feature of features) {
            const shape = document.createElementNS(NS, "path");
            shape.setAttribute("d", path(feature));
            shape.setAttribute("fill", feature.properties.name === COUNTRY ? "#fb8b55" : "#a8dc9f");
            shape.setAttribute("class", "land");
            svg.appendChild(shape);
          }

          let viewBox = `0 0 ${WIDTH} ${HEIGHT}`;
          if (selected.length) {
            const bounds = path.bounds({ type: "FeatureCollection", features: selected });
            const [[x0, y0], [x1, y1]] = bounds;
            const boxWidth = Math.max(x1 - x0, 1);
            const boxHeight = Math.max(y1 - y0, 1);
            const scale = Math.min(WIDTH / (boxWidth * 1.45), HEIGHT / (boxHeight * 1.45), 6);
            const viewWidth = WIDTH / scale;
            const viewHeight = HEIGHT / scale;
            const centerX = (x0 + x1) / 2;
            const centerY = (y0 + y1) / 2;
            viewBox = `${centerX - viewWidth / 2} ${centerY - viewHeight / 2} ${viewWidth} ${viewHeight}`;
          }
          svg.setAttribute("viewBox", viewBox);
        })
        .catch(() => {
          svg.setAttribute("viewBox", `0 0 ${WIDTH} ${HEIGHT}`);
        });
    </script>
  </body>
</html>
